version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: shorten-urls-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shorten_urls
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shorten-urls-network

  redis:
    image: redis:7-alpine
    container_name: shorten-urls-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shorten-urls-network

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: shorten-urls-elasticmq
    ports:
      - "9324:9324"
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf
    networks:
      - shorten-urls-network

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: shorten-urls-lgtm
    ports:
      - "3001:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - shorten-urls-network

volumes:
  postgres_data:
    name: shorten-urls-postgres-data
  redis_data:
    name: shorten-urls-redis-data

networks:
  shorten-urls-network:
    name: shorten-urls-network
    driver: bridge
